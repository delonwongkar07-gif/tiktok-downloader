<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      margin: 20px 0 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>TikTok Downloader</h1>
    <p>Paste link video TikTok kamu</p>

    <input
      id="url"
      type="text"
      placeholder="https://www.tiktok.com/..."
    >

    <button id="downloadBtn">DOWNLOAD</button>

    <div id="status"></div>
  </div>

  <script>
    const API_URL = "https://tiktok-api.delonwongkar07.workers.dev";

    const input = document.getElementById("url");
    const button = document.getElementById("downloadBtn");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      const url = input.value.trim();

      if (!url) {
        status.textContent = "Masukkan link TikTok dulu.";
        return;
      }

      button.disabled = true;
      status.textContent = "Memproses...";

      try {
        const response = await fetch(
          API_URL + "?url=" + encodeURIComponent(url)
        );

        if (!response.ok) {
          throw new Error("Server error");
        }

        const data = await response.json();

        if (data.download_url) {
          window.location.href = data.download_url;
          status.textContent = "Download dimulai...";
        } else {
          status.textContent = "Link download tidak ditemukan.";
        }

      } catch (error) {
        status.textContent =
          "Gagal memproses. Coba lagi.";
      }

      button.disabled = false;
    });
  </script>

</body>
</html>
