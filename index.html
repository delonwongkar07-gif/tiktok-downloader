<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  width: 90%;
  max-width: 500px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

p {
  color: #aaa;
}

input {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  margin-top: 20px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: white;
  color: black;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(0.98);
}

#result {
  margin-top: 20px;
  color: #aaa;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="box">

  <h1>TikTok Downloader</h1>

  <p>Paste your TikTok video link</p>

  <input
    id="url"
    type="text"
    placeholder="https://www.tiktok.com/..."
  >

  <button onclick="downloadVideo()">
    DOWNLOAD
  </button>

  <div id="result"></div>

</div>

<script>
async function downloadVideo() {

  const url = document.getElementById("url").value.trim();
  const result = document.getElementById("result");

  if (!url) {
    result.innerText = "Masukkan link TikTok dulu.";
    return;
  }

  result.innerText = "Processing...";

  try {

    const api =
      "https://tiktok-api.delongwonkar07.workers.dev/?url="
      + encodeURIComponent(url);

    const response = await fetch(api);

    if (!response.ok) {
      throw new Error("API error");
    }

    const data = await response.json();

    if (data.download_url) {

      result.innerHTML =
        '<a href="' +
        data.download_url +
        '" target="_blank" style="color:white;">' +
        'Download Video' +
        '</a>';

    } else {

      result.innerText =
        "API belum mengembalikan link download.";

    }

  } catch (error) {

    result.innerText =
      "Gagal terhubung ke API.";

    console.error(error);

  }
}
</script>

</body>
</html>
