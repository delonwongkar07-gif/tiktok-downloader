<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      margin: 20px 0 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      margin-top: 20px;
    }

    a {
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>TikTok Downloader</h1>
    <p>Paste your TikTok video link</p>

    <input
      id="url"
      type="text"
      placeholder="https://www.tiktok.com/..."
    >

    <button id="download" onclick="downloadVideo()">
      DOWNLOAD
    </button>

    <div id="result"></div>
  </div>

  <script>
    async function downloadVideo() {
      const input = document.getElementById("url");
      const button = document.getElementById("download");
      const result = document.getElementById("result");

      const url = input.value.trim();

      if (!url) {
        result.innerHTML = "Masukkan link TikTok dulu.";
        return;
      }

      button.disabled = true;
      button.textContent = "PROCESSING...";
      result.innerHTML = "";

      try {
        const api =
          "https://tiktok-api.delonwongkar07.workers.dev/?url=" +
          encodeURIComponent(url);

        const response = await fetch(api);
        const data = await response.json();

        if (data.download_url) {
          result.innerHTML =
            '<br><a href="' +
            data.download_url +
            '" target="_blank">DOWNLOAD VIDEO</a>';
        } else {
          result.innerHTML = "Gagal mendapatkan video.";
        }

      } catch (error) {
        result.innerHTML = "Terjadi error. Coba lagi.";
      }

      button.disabled = false;
      button.textContent = "DOWNLOAD";
    }
  </script>

</body>
</html>
