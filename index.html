<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #aaa;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 10px;
      border: none;
      margin: 20px 0 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>TikTok Downloader</h1>
    <p>Paste your TikTok video link</p>

    <input
      id="url"
      type="text"
      placeholder="https://www.tiktok.com/..."
    >

    <button onclick="download()">DOWNLOAD</button>
  </div>

  <script>
    async function download() {
      const url = document.getElementById("url").value.trim();

      if (!url) {
        alert("Masukkan link TikTok dulu!");
        return;
      }

      const response = await fetch(
        "https://tiktok-api.delonwongkar07.workers.dev/?url=" +
        encodeURIComponent(url)
      );

      const data = await response.json();

      console.log(data);
      alert(JSON.stringify(data));
    }
  </script>
</body>
</html>
